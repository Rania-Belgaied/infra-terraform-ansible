---
- name: Créer l'utilisateur dédié
  ansible.builtin.user:
    name: "{{ hardening_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true

- name: Déposer la clé SSH publique
  ansible.posix.authorized_key:
    user: "{{ hardening_user }}"
    key: "{{ lookup('file', ssh_public_key_file) }}"
    state: present

- name: Installer ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Autoriser SSH avant d'activer le pare-feu
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Refuser tout le trafic entrant par défaut
  community.general.ufw:
    default: deny
    direction: incoming

- name: Activer ufw
  community.general.ufw:
    state: enabled

- name: Désactiver le login root et l'authentification par mot de passe
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    validate: "/usr/sbin/sshd -t -f %s"
  loop:
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
  notify: Redémarrer sshd
