---
- name: Installer les paquets système de base
  ansible.builtin.apt:
    name:
      - curl
      - jq
      - git
      - ca-certificates
      - gnupg
      - python3-kubernetes
      - python3-yaml
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Installer kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"

- name: Télécharger l'archive Helm
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: "/tmp/helm-{{ helm_version }}.tar.gz"
    mode: "0644"

- name: Extraire l'archive Helm
  ansible.builtin.unarchive:
    src: "/tmp/helm-{{ helm_version }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: /tmp/linux-amd64/helm

- name: Installer le binaire Helm
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    owner: root
    group: root
    mode: "0755"
    remote_src: true

- name: Vérifier les versions installées
  ansible.builtin.command: "{{ item }}"
  loop:
    - /usr/local/bin/kubectl version --client
    - /usr/local/bin/helm version --short
  changed_when: false
